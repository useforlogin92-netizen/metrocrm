services:
  - type: web
    name: metrocrm-live
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main_portal:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BACKUP_ENABLED
        value: "true"
      - key: BACKUP_TIMEZONE
        value: Asia/Kolkata
      - key: BACKUP_LOCAL_PATH
        value: ./backups
      - key: BACKUP_CLOUD_PROVIDERS
        value: google,onedrive
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: BACKUP_GOOGLE_CLIENT_ID
        sync: false
      - key: BACKUP_GOOGLE_CLIENT_SECRET
        sync: false
      - key: BACKUP_GOOGLE_REFRESH_TOKEN
        sync: false
      - key: BACKUP_GOOGLE_FOLDER_ID
        sync: false
      - key: BACKUP_ONEDRIVE_TENANT
        value: common
      - key: BACKUP_ONEDRIVE_CLIENT_ID
        sync: false
      - key: BACKUP_ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: BACKUP_ONEDRIVE_REFRESH_TOKEN
        sync: false
      - key: BACKUP_ONEDRIVE_FOLDER_PATH
        value: MetroCRM-Backups
