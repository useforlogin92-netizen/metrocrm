services:
  - type: web
    name: metrocrm-live
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main_portal:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: metrocrm-db
          property: connectionString
      - key: BACKUP_ENABLED
        value: "true"
      - key: BACKUP_TIMEZONE
        value: Asia/Kolkata
      - key: BACKUP_LOCAL_PATH
        value: ./backups
      - key: BACKUP_CLOUD_PROVIDERS
        value: s3
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_B2_KEY_ID
        sync: false
      - key: BACKUP_B2_APPLICATION_KEY
        sync: false
      - key: BACKUP_B2_BUCKET_ID
        sync: false
      - key: BACKUP_GOOGLE_CLIENT_ID
        sync: false
      - key: BACKUP_GOOGLE_CLIENT_SECRET
        sync: false
      - key: BACKUP_GOOGLE_REFRESH_TOKEN
        sync: false
      - key: BACKUP_GOOGLE_FOLDER_ID
        sync: false
      - key: BACKUP_ONEDRIVE_TENANT
        value: common
      - key: BACKUP_ONEDRIVE_CLIENT_ID
        sync: false
      - key: BACKUP_ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: BACKUP_ONEDRIVE_REFRESH_TOKEN
        sync: false
      - key: BACKUP_ONEDRIVE_FOLDER_PATH
        value: MetroCRM-Backups
      - key: BACKUP_ALERT_EMAIL_TO
        sync: false
      - key: BACKUP_ALERT_WHATSAPP_TO
        sync: false
      - key: BACKUP_ALERT_WEBHOOK_URL
        sync: false
      - key: BACKUP_ALERT_WEBHOOK_TOKEN
        sync: false
      - key: BACKUP_MISSED_CYCLE_GRACE_MINUTES
        value: "30"

databases:
  - name: metrocrm-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: metrocrm_db
    user: metroadmin
