services:
  - type: web
    name: metrocrm-live
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main_portal:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
