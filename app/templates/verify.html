<!doctype html><html><head><meta charset="utf-8"><title>MetroCRM Verification</title><style>body{font-family:Arial;background:#f5f7fb}.card{max-width:430px;margin:80px auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 8px 30px #0001}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#1f6feb;color:white;border:0;border-radius:7px}.hint{background:#eef4ff;padding:10px;border-radius:7px}</style></head><body><div class="card"><h2>Verify Login</h2><div class="hint">Method: <b>{{ method }}</b>{% if destination %}<br>Destination: {{ destination }}{% endif %}{% if test_otp %}<br>TEST MODE OTP: <b>{{ test_otp }}</b>{% endif %}</div><form method="post" action="/auth/verify"><input type="hidden" name="token" value="{{ token }}"><input name="value" placeholder="Enter OTP / answer / approval code" required autofocus><button>Verify & Login</button></form></div></body></html>
