<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MetroCRM Caller Property Search</title><style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{font-weight:600;display:block;margin-bottom:5px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd4e0;border-radius:8px}.checks{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.checks label{white-space:nowrap;border:1px solid #d8dee9;border-radius:8px;padding:9px;font-weight:400}.checks input{width:auto}.range{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;position:sticky;bottom:10px;background:#fff;padding:12px;border-radius:10px}.btn{border:0;border-radius:8px;padding:11px 18px;cursor:pointer}.primary{background:#1f6feb;color:#fff}.result{border:1px solid #e1e6ef;border-radius:10px;padding:13px;margin:9px 0}.muted{color:#667085;font-size:13px}</style></head><body><div class="wrap"><h1>Caller Property Search</h1><p class="muted">Customer ki requirement fill karke multiple matching properties ek saath dekhein.</p><div class="card"><div class="grid"><div><label>City</label><input id="city" value="Mumbai"></div><div><label>From Station</label><select id="from"></select></div><div><label>To Station</label><select id="to"></select></div><div><label>Side</label><select id="side"><option>Both</option><option>East</option><option>West</option></select></div><div><label>Property Type</label><select id="type"><option value="">Any</option><option>Apartment</option><option>Villa</option><option>Plot</option><option>Office</option><option>Shop</option><option>Warehouse</option></select></div><div><label>Possession by</label><select id="year"></select></div></div></div><div class="card"><h3>BHK / Configuration</h3><div id="bhk" class="checks"></div><h3>Jodi</h3><div id="jodi" class="checks"></div></div><div class="card"><h3>Budget</h3><div class="range"><div><label>Minimum ₹</label><input id="min" type="number"></div><div><label>Maximum ₹</label><input id="max" type="number"></div></div></div><div class="card"><h3>Construction / Possession</h3><div id="construction" class="checks"></div></div><div class="actions"><button class="btn primary" onclick="searchProperties()">Search Matching Properties</button><button class="btn" onclick="resetSearch()">Clear</button></div><div class="card"><h2 id="summary">Search results</h2><div id="results" class="muted">Example: Malad → Andheri | East/West/Both | 2 BHK | Under Construction + Ready to Move | Possession ≤ 2028</div></div></div><script>
const stations=['Churchgate','Marine Lines','Charni Road','Grant Road','Mumbai Central','Mahalaxmi','Lower Parel','Prabhadevi','Dadar','Matunga Road','Mahim Junction','Bandra','Khar Road','Santacruz','Vile Parle','Andheri','Jogeshwari','Ram Mandir','Goregaon','Malad','Kandivali','Borivali','Dahisar','Mira Road','Bhayandar','Naigaon','Vasai Road','Nalasopara','Virar'];
const bhks=['1 BHK','2 BHK','3 BHK','4 BHK','5 BHK','More'], jodis=['2+1','2+2','3+1','3+2','3+3','4+2','4+3','4+4'], construction=['Ready to Move','Under Construction','Upcoming','Sold Out'];
function checks(id,arr){document.getElementById(id).innerHTML=arr.map((x,i)=>`<label><input type="checkbox" value="${x}" ${id==='construction'&&i<2?'checked':''}> ${x}</label>`).join('')}
function init(){['from','to'].forEach(id=>document.getElementById(id).innerHTML='<option value="">Any</option>'+stations.map(x=>`<option>${x}</option>`).join(''));document.getElementById('year').innerHTML='<option value="">Any</option>'+Array.from({length:25},(_,i)=>2026+i).map(y=>`<option>${y}</option>`).join('');checks('bhk',bhks);checks('jodi',jodis);checks('construction',construction)}
async function searchProperties(){const vals=id=>[...document.querySelectorAll(`#${id} input:checked`)].map(x=>x.value);const body={city:city.value,mumbai_station_from:from.value||null,mumbai_station_to:to.value||null,mumbai_side:side.value,bhk:vals('bhk'),jodi:vals('jodi'),budget_min:min.value?Number(min.value):null,budget_max:max.value?Number(max.value):null,property_type:type.value||null,construction_statuses:vals('construction'),possession_by:year.value?Number(year.value):null};const r=await fetch('/caller/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();summary.textContent=`${d.count||0} matching properties`;results.innerHTML=d.results?.length?d.results.map(x=>`<div class="result"><b>Property #${x.property_id}</b> — Match ${x.score}/100<br><span class="muted">${(x.reasons||[]).join(' • ')}</span></div>`).join(''):'No matching inventory returned yet. Inventory adapter will connect these filters to the property database.'}
function resetSearch(){location.reload()}init();
</script></body></html>
