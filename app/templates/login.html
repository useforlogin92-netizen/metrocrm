<!doctype html><html><head><meta charset="utf-8"><title>MetroCRM Login</title><style>body{font-family:Arial;background:#f5f7fb;margin:0}.card{max-width:430px;margin:80px auto;background:white;padding:30px;border-radius:14px;box-shadow:0 8px 30px #0001}input,select,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{cursor:pointer;background:#1f6feb;color:white;border:0;border-radius:7px}.error{color:#b00020}</style></head><body><div class="card"><h1>MetroCRM</h1><p>Secure staff login</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" action="/auth/login"><label>Username</label><input name="username" required autocomplete="username"><label>Password</label><input type="password" name="password" required autocomplete="current-password"><label>Verify with</label><select name="method" required><option value="mobile_otp">Mobile OTP</option><option value="email_otp">Email OTP</option><option value="approval">Admin/Super Admin Approval</option><option value="security_question">Security Question (Super Admin only)</option></select><button>Continue Secure Login</button></form></div></body></html>
