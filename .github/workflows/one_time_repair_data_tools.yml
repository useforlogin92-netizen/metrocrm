name: One-time Data Tools Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'useforlogin92-netizen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Repair and harden data tools
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/routers/data_tools.py')
          text = path.read_text()
          bad = '''                status = f"<span class='{'ok' if r.status == 'APPROVED' else 'pending'}">{r.status}</span>"'''
          good = '''                css_class = "ok" if r.status == "APPROVED" else "pending"\n                status = f"<span class='{css_class}'>{r.status}</span>"'''
          if bad in text:
              text = text.replace(bad, good, 1)

          text = text.replace('from openpyxl.styles import Font, PatternFill, Alignment\n', 'from openpyxl.styles import Font, PatternFill, Alignment\nfrom openpyxl.utils import get_column_letter\n', 1)
          text = text.replace('''        example = [_sample_value(sheet, f) for f in fields]\n        sh.append(example)\n''', '', 1)
          text = text.replace('''        for idx, field in enumerate(fields, start=1):\n            sh.column_dimensions[chr(64 + idx) if idx <= 26 else "A"].width = min(34, max(12, len(field) + 4))\n        sh.sheet_view.showGridLines = False\n    return _save_workbook(wb)\n''', '''        for idx, field in enumerate(fields, start=1):\n            sh.column_dimensions[get_column_letter(idx)].width = min(34, max(12, len(field) + 4))\n        sh.sheet_view.showGridLines = False\n    examples = wb.create_sheet("Examples")\n    examples.append(["Sheet", "Field", "Example Value"])\n    for cell in examples[1]:\n        cell.font = Font(bold=True, color="FFFFFF")\n        cell.fill = PatternFill("solid", fgColor="1F4E78")\n    for sheet, (_, fields) in sheets.items():\n        for field in fields:\n            example = _sample_value(sheet, field)\n            if example is not None:\n                examples.append([sheet, field, example])\n    examples.freeze_panes = "A2"\n    examples.column_dimensions["A"].width = 26\n    examples.column_dimensions["B"].width = 32\n    examples.column_dimensions["C"].width = 55\n    return _save_workbook(wb)\n''', 1)
          text = text.replace('''        "Units": (Unit, ["id", "project_id", "tower_id", "unit_number", "floor", "total_building_floors", "bhk", "property_type", "carpet_area", "built_up_area", "super_built_up_area", "plot_area", "price", "price_per_sqft", "parking", "facing", "furnishing", "possession", "rera", "availability", "status", "latitude", "longitude", "amenities_json", "photos_json", "floor_plan", "brochure", "description", "other_details"]),\n''', '''        "Units": (Unit, ["id", "project_id", "tower_id", "unit_number", "floor", "total_building_floors", "bhk", "property_type", "carpet_area", "built_up_area", "super_built_up_area", "plot_area", "price", "price_per_sqft", "parking", "facing", "furnishing", "possession", "rera", "availability", "status", "latitude", "longitude", "amenities_json", "photos_json", "floor_plan", "brochure", "description", "other_details"]),\n        "NearbyLocations": (__import__("app.models", fromlist=["NearbyLocation"]).NearbyLocation, ["id", "project_id", "category", "name", "distance", "details", "verified", "verified_at"]),\n''', 1)
          text = text.replace('''def _descendant_ids(actor, db: Session) -> set[int]:\n    if actor.role in {"SUPER_ADMIN", "ADMIN"}:\n        return {u.id for u in db.scalars(select(type(actor).id)).all()}\n''', '''def _descendant_ids(actor, db: Session) -> set[int]:\n    if actor.role in {"SUPER_ADMIN", "ADMIN"}:\n        return set(db.scalars(select(type(actor).id)).all())\n''', 1)
          marker = '''def _convert_excel_value(column, value):\n'''
          report_helper = '''def _export_report_workbook(actor, db: Session) -> BytesIO:\n    data = _report_data(actor, db)\n    wb = Workbook()\n    ws = wb.active\n    ws.title = "Report Summary"\n    ws.append(["Metric", "Value"])\n    for cell in ws[1]:\n        cell.font = Font(bold=True, color="FFFFFF")\n        cell.fill = PatternFill("solid", fgColor="1F4E78")\n    for key, value in data["metrics"].items():\n        ws.append([key, _excel_value(value)])\n    team = wb.create_sheet("Team Scope")\n    team.append(["User ID", "Username", "Role", "Reporting Manager ID"])\n    for user in data["users"]:\n        team.append([user.id, user.username, user.role, user.reporting_manager_id])\n    return _save_workbook(wb)\n\n\n'''
          if 'def _export_report_workbook' not in text:
              text = text.replace(marker, report_helper + marker, 1)
          text = text.replace('''    if entity_type not in _models():\n''', '''    if entity_type != "REPORTS" and entity_type not in _models():\n''', 1)
          text = text.replace('''        workbook = _export_workbook([entity_type], db)\n        approval.status = "COMPLETED"\n''', '''        workbook = _export_report_workbook(actor, db) if entity_type == "REPORTS" else _export_workbook([entity_type], db)\n        approval.status = "COMPLETED"\n''', 1)
          text = text.replace('''        workbook = _export_workbook([entity_type], db)\n        _audit(db, actor.id, "DATA_EXPORT_COMPLETED", entity_type, None, {"approval": "super_admin_direct"})\n''', '''        workbook = _export_report_workbook(actor, db) if entity_type == "REPORTS" else _export_workbook([entity_type], db)\n        _audit(db, actor.id, "DATA_EXPORT_COMPLETED", entity_type, None, {"approval": "super_admin_direct"})\n''', 1)
          path.write_text(text)

          test = Path('tests/test_data_tools.py')
          test_text = test.read_text()
          test_text = test_text.replace('''    ws = wb["Developers"]\n    ws.delete_rows(2, ws.max_row)\n''', '''    for sheet in wb.sheetnames:\n        if sheet not in {"Developers", "Instructions", "Examples"}:\n            wb[sheet].delete_rows(2, wb[sheet].max_row)\n    ws = wb["Developers"]\n    ws.delete_rows(2, ws.max_row)\n''', 1)
          test.write_text(test_text)
          PY
      - name: Verify repair
        run: |
          PYTHONPATH=. python -m compileall -q app
          PYTHONPATH=. pytest -q -W error::DeprecationWarning
      - name: Commit repair and remove one-time workflow
        run: |
          rm .github/workflows/one_time_repair_data_tools.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/routers/data_tools.py app/portal.py tests/test_data_tools.py .github/workflows/one_time_repair_data_tools.yml
          git commit -m 'fix: harden data tools and report exports'
          git push
