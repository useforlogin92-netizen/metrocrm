name: One-time CRM Plus Registration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  register:
    if: github.actor == 'useforlogin92-netizen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register advanced CRM router
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/main.py')
          text = path.read_text()
          import_anchor = 'from app.routers.data_tools import router as data_tools_router\n'
          if 'from app.routers.crm_plus import router as crm_plus_router' not in text:
              text = text.replace(import_anchor, import_anchor + 'from app.routers.crm_plus import router as crm_plus_router\n', 1)
          include_anchor = 'app.include_router(data_tools_router)\n'
          if 'app.include_router(crm_plus_router)' not in text:
              text = text.replace(include_anchor, include_anchor + 'app.include_router(crm_plus_router)\n', 1)
          path.write_text(text)
          PY
      - name: Verify
        run: |
          python -m py_compile app/main.py app/crm_plus_models.py app/routers/crm_plus.py
          grep -q 'app.include_router(crm_plus_router)' app/main.py
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/one_time_crm_plus_register.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/crm_plus_models.py app/routers/crm_plus.py app/email_verification.py .github/workflows/one_time_crm_plus_register.yml
          git commit -m 'feat: expose advanced CRM operations hub'
          git push
