name: One-time Data Tools Registration Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'useforlogin92-netizen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register router in main app
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/main.py')
          text = path.read_text()
          import_anchor = 'from app.routers.integrations import router as integrations_router\n'
          if 'from app.routers.data_tools import router as data_tools_router' not in text:
              text = text.replace(import_anchor, import_anchor + 'from app.routers.data_tools import router as data_tools_router\n', 1)
          include_anchor = 'app.include_router(integrations_router)\n'
          if 'app.include_router(data_tools_router)' not in text:
              text = text.replace(include_anchor, include_anchor + 'app.include_router(data_tools_router)\n', 1)
          path.write_text(text)
          PY
      - name: Verify registration
        run: |
          python -m py_compile app/main.py app/routers/data_tools.py
          grep -q 'app.include_router(data_tools_router)' app/main.py
      - name: Commit repair and remove one-time workflow
        run: |
          rm .github/workflows/one_time_register_data_tools.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py .github/workflows/one_time_register_data_tools.yml
          git commit -m 'fix: register data tools router in main app'
          git push
