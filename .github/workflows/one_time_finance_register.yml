name: One-time Finance Router Registration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  register:
    if: github.actor == 'useforlogin92-netizen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register router
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/main.py')
          text = path.read_text()
          import_anchor = 'from app.routers.crm_plus import router as crm_plus_router\n'
          if 'from app.routers.realestate_finance import router as realestate_finance_router' not in text:
              text = text.replace(import_anchor, import_anchor + 'from app.routers.realestate_finance import router as realestate_finance_router\n', 1)
          include_anchor = 'app.include_router(crm_plus_router)\n'
          if 'app.include_router(realestate_finance_router)' not in text:
              text = text.replace(include_anchor, include_anchor + 'app.include_router(realestate_finance_router)\n', 1)
          path.write_text(text)
          PY
      - name: Verify
        run: python -m py_compile app/main.py app/routers/realestate_finance.py app/realestate_finance_models.py
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/one_time_finance_register.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/routers/realestate_finance.py app/realestate_finance_models.py app/email_verification.py .github/workflows/one_time_finance_register.yml
          git commit -m 'feat: expose cost sheets and quotations'
          git push
