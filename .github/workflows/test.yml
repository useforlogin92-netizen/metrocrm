name: MetroCRM Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/cleanup_deprecations.py
      - run: PYTHONPATH=. pytest -q 2>&1 | tee pytest-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-output
          path: pytest-output.txt
          retention-days: 1
