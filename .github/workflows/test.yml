name: MetroCRM Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/cleanup_deprecations.py
      - uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const status = execSync('git status --short app tests', { encoding: 'utf8' }).trim();
            if (!status) {
              core.info('No deprecation cleanup changes required.');
              return;
            }
            const files = status.split('\n').map(line => line.slice(3)).filter(Boolean);
            for (const file of files) {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: file,
                ref: context.ref.replace('refs/heads/', ''),
              });
              if (Array.isArray(current.data)) throw new Error(`Expected file: ${file}`);
              const content = require('fs').readFileSync(file).toString('base64');
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: file,
                message: 'chore: remove deprecated datetime and FastAPI lifecycle APIs',
                content,
                sha: current.data.sha,
                branch: context.ref.replace('refs/heads/', ''),
              });
            }
      - run: PYTHONPATH=. pytest -q 2>&1 | tee pytest-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-output
          path: pytest-output.txt
          retention-days: 1
