name: One-time Super Admin Portal Repair V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore dedicated portal loader and property-submission bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('app/main.py')
          text = main.read_text(encoding='utf-8')
          loader = 'import app.portal_boundary  # noqa: F401\n'
          if loader not in text:
              text = text.rstrip() + '\n\n' + loader
              main.write_text(text, encoding='utf-8')

          boundary = Path('app/portal_boundary.py')
          text = boundary.read_text(encoding='utf-8')
          needle = '    ("/admin/property-data", "/super-admin/property-data"),\n'
          addition = needle + '    ("/admin/property-submissions", "/super-admin/property-submissions"),\n'
          if '"/admin/property-submissions", "/super-admin/property-submissions"' not in text:
              if needle not in text:
                  raise SystemExit('portal boundary anchor not found')
              text = text.replace(needle, addition, 1)
              boundary.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair and remove one-time workflows
        shell: bash
        run: |
          rm -f .github/workflows/repair-super-admin-portal.yml .github/workflows/repair-super-admin-portal-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/portal_boundary.py .github/workflows/repair-super-admin-portal.yml .github/workflows/repair-super-admin-portal-v2.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Restore dedicated Super Admin portal boundary'
          git push
