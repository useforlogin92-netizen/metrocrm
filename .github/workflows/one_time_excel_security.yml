name: One-time Excel Security Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'useforlogin92-netizen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sanitize spreadsheet exports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/routers/data_tools.py')
          text = path.read_text()
          old = '''def _excel_value(value: Any):\n    if isinstance(value, (datetime, date)):\n        return value.isoformat(sep=" ") if isinstance(value, datetime) else value.isoformat()\n    if isinstance(value, Decimal):\n        return float(value)\n    if isinstance(value, (dict, list)):\n        return json.dumps(value, ensure_ascii=False)\n    return value\n'''
          new = '''def _excel_value(value: Any):\n    if isinstance(value, (datetime, date)):\n        return value.isoformat(sep=" ") if isinstance(value, datetime) else value.isoformat()\n    if isinstance(value, Decimal):\n        return float(value)\n    if isinstance(value, (dict, list)):\n        return json.dumps(value, ensure_ascii=False)\n    if isinstance(value, str) and value[:1] in {"=", "+", "-", "@", "\\t", "\\r", "\\n", "\\x00", "＝", "＋", "－", "＠"}:\n        return "'" + value\n    return value\n'''
          if old not in text:
              raise SystemExit('Expected _excel_value block not found')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/test_data_tools.py')
          test_text = test.read_text()
          test_text = test_text.replace('from app.routers.data_tools import _descendant_ids, _import_workbook, _template_workbook\n', 'from app.routers.data_tools import _descendant_ids, _excel_value, _import_workbook, _template_workbook\n', 1)
          test_text += '''\n\ndef test_excel_export_neutralizes_formula_prefixes():\n    assert _excel_value("=1+1") == "'=1+1"\n    assert _excel_value("@SUM(1,1)") == "'@SUM(1,1)"\n    assert _excel_value("normal text") == "normal text"\n    assert _excel_value(100) == 100\n'''
          test.write_text(test_text)
          PY
      - name: Verify security repair
        run: |
          PYTHONPATH=. python -m compileall -q app
          PYTHONPATH=. pytest -q -W error::DeprecationWarning
      - name: Commit repair and remove one-time workflow
        run: |
          rm .github/workflows/one_time_excel_security.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/routers/data_tools.py tests/test_data_tools.py .github/workflows/one_time_excel_security.yml
          git commit -m 'security: neutralize spreadsheet formula exports'
          git push
